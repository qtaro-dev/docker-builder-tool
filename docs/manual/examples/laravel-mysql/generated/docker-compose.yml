version: "3.9"
services:
  "laravel-mysql-mysql":
    image: "mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69"
    restart: "always"
    ports:
      - "13306:3306"
    volumes:
      - "laravel-mysql-mysql-data:/var/lib/mysql"
    environment:
      - "MYSQL_DATABASE=appdb"
      - "MYSQL_USER=appuser"
      - "MYSQL_PASSWORD=demo-recipe-only-42"
      - "MYSQL_ROOT_PASSWORD=demo-recipe-only-42"
  "laravel-mysql-laravel":
    build:
      context: "./laravel"
      dockerfile: "Dockerfile.laravel"
    working_dir: "/app"
    env_file: ["./laravel/.env"]
    restart: "always"
    ports:
      - "18000:8000"
    volumes:
      - "./laravel:/app"
    environment:
      - "APP_ENV=local"
      - "APP_DEBUG=true"
      - "DB_CONNECTION=mysql"
      - "DB_HOST=laravel-mysql-mysql"
      - "DB_PORT=3306"
      - "DB_DATABASE=appdb"
      - "DB_USERNAME=appuser"
      - "DB_PASSWORD=demo-recipe-only-42"
    depends_on:
      - "laravel-mysql-mysql"
    command: ["php","artisan","serve","--host=0.0.0.0","--port=8000"]
volumes:
  "laravel-mysql-mysql-data":