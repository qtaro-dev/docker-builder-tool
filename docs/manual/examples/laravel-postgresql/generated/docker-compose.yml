version: "3.9"
services:
  "laravel-postgresql-postgres":
    image: "postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0"
    restart: "always"
    ports:
      - "15432:5432"
    volumes:
      - "laravel-postgresql-postgres-data:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_DB=appdb"
      - "POSTGRES_USER=appuser"
      - "POSTGRES_PASSWORD=demo-recipe-only-42"
  "laravel-postgresql-laravel":
    build:
      context: "./laravel"
      dockerfile: "Dockerfile.laravel"
    working_dir: "/app"
    env_file: ["./laravel/.env"]
    restart: "always"
    ports:
      - "18000:8000"
    volumes:
      - "./laravel:/app"
    environment:
      - "APP_ENV=local"
      - "APP_DEBUG=true"
      - "DB_CONNECTION=pgsql"
      - "DB_HOST=laravel-postgresql-postgres"
      - "DB_PORT=5432"
      - "DB_DATABASE=appdb"
      - "DB_USERNAME=appuser"
      - "DB_PASSWORD=demo-recipe-only-42"
    depends_on:
      - "laravel-postgresql-postgres"
    command: ["php","artisan","serve","--host=0.0.0.0","--port=8000"]
volumes:
  "laravel-postgresql-postgres-data":