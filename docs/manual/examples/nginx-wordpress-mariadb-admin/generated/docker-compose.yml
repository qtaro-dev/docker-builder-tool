version: "3.9"
services:
  "nginx-wordpress-mariadb-admin-nginx":
    image: "nginx:1.30.6-trixie@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20"
    restart: "always"
    ports:
      - "18380:80"
    volumes:
      - "./fixture-web:/usr/share/nginx/html:ro"
  "nginx-wordpress-mariadb-admin-phpmyadmin":
    image: "phpmyadmin/phpmyadmin:5.2.3@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb"
    restart: "always"
    ports:
      - "18083:80"
    environment:
      - "PMA_HOST=nginx-wordpress-mariadb-admin-mariadb"
      - "PMA_USER=appuser"
      - "PMA_PASSWORD=demo-recipe-only-42"
    depends_on:
      - "nginx-wordpress-mariadb-admin-mariadb"
  "nginx-wordpress-mariadb-admin-mariadb":
    image: "mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873"
    restart: "always"
    ports:
      - "13309:3306"
    volumes:
      - "nginx-wordpress-mariadb-admin-mariadb-data:/var/lib/mysql"
    environment:
      - "MYSQL_DATABASE=appdb"
      - "MYSQL_USER=appuser"
      - "MYSQL_PASSWORD=demo-recipe-only-42"
      - "MYSQL_ROOT_PASSWORD=demo-recipe-only-42"
  "nginx-wordpress-mariadb-admin-wordpress":
    image: "wordpress:7.1.3-php8.4-apache@sha256:edbfa4a140f7c5950435f5737538ad83d25af4661b74b990d7ec1eff3bec99a8"
    restart: "always"
    ports:
      - "18092:80"
    volumes:
      - "nginx-wordpress-mariadb-admin-wordpress-data:/var/www/html"
    environment:
      - "WORDPRESS_DB_HOST=nginx-wordpress-mariadb-admin-mariadb"
      - "WORDPRESS_DB_NAME=appdb"
      - "WORDPRESS_DB_USER=appuser"
      - "WORDPRESS_DB_PASSWORD=demo-recipe-only-42"
    depends_on:
      - "nginx-wordpress-mariadb-admin-mariadb"
volumes:
  "nginx-wordpress-mariadb-admin-mariadb-data":
  "nginx-wordpress-mariadb-admin-wordpress-data":