services:
  nginx-wordpress-mariadb-admin-wordpress:
    environment:
      WORDPRESS_CONFIG_EXTRA: |-
        define('WP_HOME', 'http://localhost:18380');
        define('WP_SITEURL', 'http://localhost:18380');
  nginx-wordpress-mariadb-admin-nginx:
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nginx-wordpress-mariadb-admin-wordpress:
        condition: service_started
