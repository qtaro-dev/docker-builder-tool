version: "3.9"
services:
  "nginx-flask-postgresql-redis-nginx":
    image: "nginx:1.30.6-trixie@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20"
    restart: "always"
    ports:
      - "18280:80"
    volumes:
      - "./fixture-web:/usr/share/nginx/html:ro"
  "nginx-flask-postgresql-redis-redis":
    image: "redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541"
    restart: "always"
    ports:
      - "16381:6379"
    volumes:
      - "nginx-flask-postgresql-redis-redis-data:/data"
  "nginx-flask-postgresql-redis-postgres":
    image: "postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0"
    restart: "always"
    ports:
      - "15443:5432"
    volumes:
      - "nginx-flask-postgresql-redis-postgres-data:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_DB=appdb"
      - "POSTGRES_USER=appuser"
      - "POSTGRES_PASSWORD=demo-recipe-only-42"
  "nginx-flask-postgresql-redis-flask":
    build:
      context: "./python-web"
      dockerfile: "Dockerfile.python-web"
    working_dir: "/app"
    restart: "always"
    ports:
      - "15100:5000"
    volumes:
      - "./python-web:/app"
    environment:
      - "FRAMEWORK=flask"
    command: ["sh","-c","flask run --host=0.0.0.0 --port=5000"]
volumes:
  "nginx-flask-postgresql-redis-redis-data":
  "nginx-flask-postgresql-redis-postgres-data":