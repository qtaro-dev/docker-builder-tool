services:
  nginx-flask-postgresql-redis-postgres:
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/001-recipe.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  nginx-flask-postgresql-redis-redis:
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
  nginx-flask-postgresql-redis-flask:
    environment:
      DB_HOST: nginx-flask-postgresql-redis-postgres
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: demo-recipe-only-42
      REDIS_URL: redis://nginx-flask-postgresql-redis-redis:6379
    depends_on:
      nginx-flask-postgresql-redis-postgres:
        condition: service_healthy
      nginx-flask-postgresql-redis-redis:
        condition: service_healthy
  nginx-flask-postgresql-redis-nginx:
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nginx-flask-postgresql-redis-flask:
        condition: service_started
