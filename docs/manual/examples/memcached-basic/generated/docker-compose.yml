version: "3.9"
services:
  "memcached-basic-memcached":
    image: "memcached:1.6.45-alpine@sha256:6a089e37cbb8acd75c80c6c0667fe57ec54db68782fb1b3afb1d0eb265e50070"
    restart: "always"
    ports:
      - "11211:11211"
    volumes:
      - "memcached-basic-memcached-data:/data"
    command: ["memcached","-m","64"]
volumes:
  "memcached-basic-memcached-data":