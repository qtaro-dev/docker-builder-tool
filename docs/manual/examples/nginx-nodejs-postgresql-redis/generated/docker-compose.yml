version: "3.9"
services:
  "nginx-nodejs-postgresql-redis-nginx":
    image: "nginx:1.30.6-trixie@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20"
    restart: "always"
    ports:
      - "18180:80"
    volumes:
      - "./fixture-web:/usr/share/nginx/html:ro"
  "nginx-nodejs-postgresql-redis-redis":
    image: "redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541"
    restart: "always"
    ports:
      - "16380:6379"
    volumes:
      - "nginx-nodejs-postgresql-redis-redis-data:/data"
  "nginx-nodejs-postgresql-redis-postgres":
    image: "postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0"
    restart: "always"
    ports:
      - "15442:5432"
    volumes:
      - "nginx-nodejs-postgresql-redis-postgres-data:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_DB=appdb"
      - "POSTGRES_USER=appuser"
      - "POSTGRES_PASSWORD=demo-recipe-only-42"
  "nginx-nodejs-postgresql-redis-nodejs":
    build:
      context: "./nodejs"
      dockerfile: "Dockerfile.nodejs"
    working_dir: "/app"
    restart: "always"
    ports:
      - "13100:3000"
    command: ["sh","-c","npm run dev"]
volumes:
  "nginx-nodejs-postgresql-redis-redis-data":
  "nginx-nodejs-postgresql-redis-postgres-data":