version: "3.9"
services:
  "nodejs-mariadb-mariadb":
    image: "mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873"
    restart: "always"
    ports:
      - "13307:3306"
    volumes:
      - "nodejs-mariadb-mariadb-data:/var/lib/mysql"
    environment:
      - "MYSQL_DATABASE=appdb"
      - "MYSQL_USER=appuser"
      - "MYSQL_PASSWORD=demo-recipe-only-42"
      - "MYSQL_ROOT_PASSWORD=demo-recipe-only-42"
  "nodejs-mariadb-nodejs":
    build:
      context: "./nodejs"
      dockerfile: "Dockerfile.nodejs"
    working_dir: "/app"
    restart: "always"
    ports:
      - "13000:3000"
    command: ["sh","-c","npm run dev"]
volumes:
  "nodejs-mariadb-mariadb-data":