version: "3.9"
services:
  "nginx-nodejs-mysql-nginx":
    image: "nginx:1.30.6-trixie@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20"
    restart: "always"
    ports:
      - "18080:80"
    volumes:
      - "./fixture-web:/usr/share/nginx/html:ro"
  "nginx-nodejs-mysql-mysql":
    image: "mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69"
    restart: "always"
    ports:
      - "13306:3306"
    volumes:
      - "nginx-nodejs-mysql-mysql-data:/var/lib/mysql"
    environment:
      - "MYSQL_DATABASE=appdb"
      - "MYSQL_USER=appuser"
      - "MYSQL_PASSWORD=demo-recipe-only-42"
      - "MYSQL_ROOT_PASSWORD=demo-recipe-only-42"
  "nginx-nodejs-mysql-nodejs":
    build:
      context: "./nodejs"
      dockerfile: "Dockerfile.nodejs"
    working_dir: "/app"
    restart: "always"
    ports:
      - "13000:3000"
    command: ["sh","-c","npm run dev"]
volumes:
  "nginx-nodejs-mysql-mysql-data":