name: Docker validation (v0.3.0)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run manually
        type: choice
        options: [manual-recipes, six-cases]
        default: manual-recipes

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual-recipes:
    if: inputs.suite == 'manual-recipes'
    uses: ./.github/workflows/manual-recipes-validation.yml

  docker-validation:
    if: inputs.suite == 'six-cases'
    name: Generated Compose and Dockerfile (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Existing and CI unit tests
        # Electron 45のバイナリはrequire時に取得される。Ubuntuの単体/生成検証ではrequireしない。
        run: npm test
      - name: npm dependency audit
        run: npm audit
      - name: Ensure PostgreSQL test client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version
      - name: Generate and verify six running Docker configurations
        env:
          DOCKER_VALIDATION_ARTIFACTS: ${{ runner.temp }}/docker-validation-artifacts
        run: npm run test:docker
        timeout-minutes: 28
      - name: Cleanup owned validation projects after interruption
        if: always()
        timeout-minutes: 3
        env:
          DOCKER_VALIDATION_ARTIFACTS: ${{ runner.temp }}/docker-validation-artifacts
        run: node scripts/docker-validation.cjs --cleanup-only
      - name: Write validation summary (including failures or not-run cases)
        if: always()
        env:
          DOCKER_VALIDATION_ARTIFACTS: ${{ runner.temp }}/docker-validation-artifacts
        run: node scripts/docker-validation.cjs --summary-only
      - name: Upload generated fixtures and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-validation-artifacts/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

  electron-regression:
    if: inputs.suite == 'six-cases'
    name: Existing Electron regression (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Install dependencies including Electron
        run: npm ci
      - name: Existing Electron GUI and security tests
        shell: pwsh
        run: |
          npm run test:electron 2>&1 | Tee-Object -FilePath electron-ci.log
          exit $LASTEXITCODE
      - name: Upload Electron log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: electron-ci.log
          retention-days: 7
          if-no-files-found: warn
